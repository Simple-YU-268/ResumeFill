<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>招聘表单测试</title><link rel="stylesheet" href="style.css"><style>form{max-width:700px;margin:auto}fieldset{margin:20px 0;border:1px solid #d8e2e5;border-radius:12px;padding:20px}label{display:block;margin:12px 0}input,select,textarea{display:block;width:100%;padding:10px;border:1px solid #cddadd;border-radius:6px}textarea{height:100px}</style></head><body><form><h1>招聘表单 · 本地测试</h1><p>打开扩展扫描此页，检查匹配后填充。</p><fieldset><legend>基本信息</legend><label>姓名<input name="fullName"></label><label>电子邮箱<input type="email"></label><label>手机号码<input type="tel"></label><label>现居城市<input></label><label>性别<select><option value="">请选择</option><option>男</option><option>女</option></select></label><label>验证码<input></label></fieldset><fieldset><legend>教育经历</legend><label>学校名称<input></label><label>专业<input></label><label>学历<select><option value="">请选择</option><option>本科</option><option>硕士</option><option>博士</option></select></label><label>入学时间<input type="month"></label><label>毕业时间<input type="month"></label></fieldset><fieldset><legend>实习经历</legend><label>公司名称<input></label><label>职位名称<input></label><label>开始时间<input type="month"></label><label>结束时间<input type="month"></label><label>工作内容<textarea></textarea></label></fieldset><fieldset><legend>项目经历</legend><label>项目名称<input></label><label>项目角色<input></label><label>项目介绍<textarea></textarea></label></fieldset><label>专业技能<textarea></textarea></label><label>自我评价<textarea></textarea></label></form></body></html>
