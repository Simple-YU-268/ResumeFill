<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>简历快填</title><link rel="stylesheet" href="style.css"></head><body class="popup"><header><div><span class="eyebrow">RESUME / AUTOFILL</span><h1>让简历，少填一次。</h1></div><span class="badge">本地存储</span></header><p>按可见标签、站点规则与经历卡片匹配资料。</p><div class="actions"><button id="agentStart" data-always>Agent 填写已核对字段</button><button id="agentResume" data-always>继续 Agent</button><button id="agentRefresh" data-always>查看 Agent 状态</button><button id="agentStop" data-always>停止 Agent</button><button id="agentApply" data-always>应用 Agent 建议</button><button id="agentExport" data-always>导出 Agent 检查记录</button></div><div id="agentStatus" role="status"></div><div class="actions"><button id="scan" class="primary">扫描当前页面</button><button id="edit">管理简历与站点规则</button><button id="prepare" disabled>补齐经历并重新扫描</button></div><div class="actions"><button id="normalizeProfile" data-always>整理地区与日期 JSON</button><button id="saveAnswers" data-always>保存补充资料到 JSON</button><button id="incremental" data-always>扫描新增与失败字段</button><button id="aiPreview" data-always>预览 AI 请求</button><button id="aiRun" data-always>请求 AI 建议</button><button id="aiApply" data-always>应用已核对的 AI 建议</button><button id="cancelFill" data-always>取消填写</button><button id="aiCancel" data-always>取消 AI 请求</button></div><p><label><input id="shareValues" type="checkbox">本次 AI 请求附带简历值</label></p><pre id="aiPayload" hidden style="white-space:pre-wrap;max-height:240px;overflow:auto"></pre><div class="card"><div id="summary">先保存简历，再扫描招聘页面。</div><div id="normalization"></div><div id="fields"></div></div><div class="actions"><button id="fill" class="primary" disabled>一键填充已匹配字段</button><button id="remember" disabled>记住匹配</button></div><p><label><input type="checkbox" id="overwrite"> 允许覆盖已有内容</label><br><label><input type="checkbox" id="saveCards"> 按站点规则保存回读通过的经历卡片</label></p><div id="status" role="status"></div><p class="muted">不自动提交申请。复杂控件需命中适配规则；图片文字、附件与跨域 iframe 暂需手动处理。</p><div class="actions"><button id="screenshot" data-always>查看当前页截图</button><button id="checkpoint" data-always>导出检查记录</button></div><img id="pagePreview" hidden alt="当前视口截图，仅供人工核对" style="width:100%;margin-top:16px"><script src="matcher.js"></script><script src="profile.js"></script><script src="adapters.js"></script><script src="answers.js"></script><script src="ai.js"></script><script src="popup.js"></script></body></html>
