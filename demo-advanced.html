<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>简历快填 · 高级测试表单</title><link rel="stylesheet" href="style.css"><style>main{max-width:900px;margin:auto}.form-row{margin:14px 0}input,select{padding:9px;border:1px solid #bacccd;border-radius:6px}.field-label{display:inline-block;min-width:110px}.experience-card{border:1px solid #dbe5e5;border-radius:12px;padding:18px;margin:16px 0}.menu{padding:12px;background:#edf5f2;border-radius:8px}.menu[hidden]{display:none}.combo{display:inline-block;border:1px solid #bacccd;padding:10px;min-width:180px;cursor:pointer}.saved-marker{color:#127c6c}</style></head><body><main><h1>高级测试表单</h1><p>载入 sample-adapters.json 和虚构简历后，扫描 → 补齐经历 → 填充。此页仅在内存里保存数据，不向服务器提交。</p><section id="basics" class="card"><h2>基本信息</h2><div class="form-row"><label for="full-name" class="field-label">姓名</label><input id="full-name" required></div><div class="form-row"><label for="email" class="field-label">邮箱</label><input id="email" type="email" required></div><div class="form-row"><span class="field-label">性别</span><span id="gender-group"><label><input type="radio" name="gender" value="M">男</label><label><input type="radio" name="gender" value="F">女</label></span></div><div class="form-row"><span class="field-label">城市</span><div id="city-combo" class="combo" role="combobox" aria-controls="city-list" aria-expanded="false"><span id="city-value"></span></div><div id="city-menu" class="menu" hidden><input id="city-search" aria-label="搜索城市"><div id="city-list" role="listbox"></div></div></div><div class="form-row"><span class="field-label">地区</span><button type="button" id="region-combo"><span id="region-value"></span> 选择地区</button><div id="region-panel" class="menu" hidden><div data-level="0"></div><div data-level="1"></div></div></div><div style="opacity:0"><label>隐藏字段<input id="hidden"></label></div><input id="password" type="password" hidden></section><section id="education" class="card"><h2>教育经历</h2><button type="button" class="add-card">新增教育经历</button><div class="cards"></div></section><pre id="saved-data"></pre><script src="demo-advanced.js"></script></main></body></html>
