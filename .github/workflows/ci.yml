name: Tests and privacy
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run privacy
      - run: npm test
      - run: npm --prefix desktop ci
      - run: npm --prefix desktop run prepare:resources
      - run: npm --prefix desktop test
      - run: node desktop/auth-ui-test.cjs
      - run: npm run test:browser
      - run: node scripts/verify-ai-browser.cjs --mock
      - run: node desktop/ocr-test.cjs --engine-only
      - run: node desktop/web-ocr-test.cjs
