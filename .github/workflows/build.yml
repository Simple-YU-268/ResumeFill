name: Build Windows installer
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run version:check
      - run: npm run privacy
      - run: npm --prefix desktop ci
      - run: npm run build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - run: npm run privacy:artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: ResumeFill-Windows
          path: |
            dist/desktop/*Setup.exe
            dist/desktop/latest.yml
            dist/desktop/*.blockmap
